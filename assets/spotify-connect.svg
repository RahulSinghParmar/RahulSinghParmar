<svg xmlns="http://www.w3.org/2000/svg" width="680" height="132" viewBox="0 0 680 132" role="img" aria-labelledby="spotify-title spotify-description">
  <title id="spotify-title">Spotify activity connection preview</title>
  <desc id="spotify-description">Transparent animated preview shown until Rahul reconnects Spotify.</desc>
  <defs>
    <radialGradient id="disc"><stop offset="0" stop-color="#5eead4"/><stop offset="0.19" stop-color="#0f766e"/><stop offset="0.21" stop-color="#f8fafc"/><stop offset="1" stop-color="#334155"/></radialGradient>
    <style>
      .title { fill:#0f172a } .copy { fill:#64748b }
      @media (prefers-color-scheme: dark) { .title { fill:#f8fafc } .copy { fill:#94a3b8 } }
    </style>
  </defs>
  <circle cx="82" cy="66" r="48" fill="url(#disc)" stroke="#2dd4bf" stroke-opacity="0.42">
    <animateTransform attributeName="transform" type="rotate" from="0 82 66" to="360 82 66" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="66" r="7" fill="#f59e0b"/>
  <text x="154" y="42" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">NOW PLAYING</text>
  <text class="title" x="154" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Spotify activity</text>
  <text class="copy" x="154" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="14">Reconnect once to activate the live track</text>
  <g fill="#2dd4bf">
    <rect x="602" y="55" width="4" height="20" rx="2"><animate attributeName="height" values="20;34;20" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="55;41;55" dur=".9s" repeatCount="indefinite"/></rect>
    <rect x="611" y="47" width="4" height="28" rx="2"><animate attributeName="height" values="28;12;28" dur=".7s" repeatCount="indefinite"/><animate attributeName="y" values="47;63;47" dur=".7s" repeatCount="indefinite"/></rect>
    <rect x="620" y="40" width="4" height="35" rx="2"><animate attributeName="height" values="35;18;35" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="40;57;40" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="629" y="53" width="4" height="22" rx="2"><animate attributeName="height" values="22;32;22" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="53;43;53" dur=".8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
