<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Infrastructure delivery path">
  <title>Infrastructure delivery path</title>
  <rect width="1000" height="220" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="500" y="30" text-anchor="middle" fill="#24292f" font-size="17" font-weight="700">from packet to platform</text>
    <text x="500" y="52" text-anchor="middle" fill="#57606a" font-size="12">observe · secure · automate · recover</text>
    <path id="link0" d="M160 114 H205" stroke="#d0d7de" stroke-width="2"/><circle r="4" fill="#1a7f37" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".1s" fill="freeze"/><animateMotion dur="1.80s" repeatCount="indefinite"><mpath href="#link0"/></animateMotion></circle><path id="link1" d="M335 114 H390" stroke="#d0d7de" stroke-width="2"/><circle r="4" fill="#1a7f37" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".1s" fill="freeze"/><animateMotion dur="2.05s" repeatCount="indefinite"><mpath href="#link1"/></animateMotion></circle><path id="link2" d="M520 114 H575" stroke="#d0d7de" stroke-width="2"/><circle r="4" fill="#1a7f37" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".1s" fill="freeze"/><animateMotion dur="2.30s" repeatCount="indefinite"><mpath href="#link2"/></animateMotion></circle><path id="link3" d="M705 114 H760" stroke="#d0d7de" stroke-width="2"/><circle r="4" fill="#1a7f37" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".1s" fill="freeze"/><animateMotion dur="2.55s" repeatCount="indefinite"><mpath href="#link3"/></animateMotion></circle><rect x="30" y="82" width="130" height="64" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="95" y="107" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="700">USERS</text><text x="95" y="127" text-anchor="middle" fill="#57606a" font-size="11">requests</text><rect x="205" y="82" width="130" height="64" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="270" y="107" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="700">EDGE</text><text x="270" y="127" text-anchor="middle" fill="#57606a" font-size="11">DNS · VPN</text><rect x="390" y="82" width="130" height="64" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="455" y="107" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="700">NETWORK</text><text x="455" y="127" text-anchor="middle" fill="#57606a" font-size="11">VLAN · routing</text><rect x="575" y="82" width="130" height="64" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="640" y="107" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="700">SYSTEMS</text><text x="640" y="127" text-anchor="middle" fill="#57606a" font-size="11">Linux · Windows</text><rect x="760" y="82" width="130" height="64" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="825" y="107" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="700">CLOUD</text><text x="825" y="127" text-anchor="middle" fill="#57606a" font-size="11">AWS · services</text>
    <path d="M455 146 V181 H825 V146" fill="none" stroke="#1a7f37" stroke-opacity=".5" stroke-dasharray="5 6"/>
    <text x="640" y="202" text-anchor="middle" fill="#57606a" font-size="11">monitoring + security feedback loop</text>
  </g>
