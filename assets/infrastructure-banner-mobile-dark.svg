<svg xmlns="http://www.w3.org/2000/svg" width="420" height="540" viewBox="0 0 420 540" role="img" aria-label="Infrastructure delivery path">
  <title>Infrastructure delivery path</title>
  <rect width="420" height="540" fill="#0d1117"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="210" y="27" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">from packet to platform</text>
    <text x="210" y="48" text-anchor="middle" fill="#8b949e" font-size="12">observe · secure · automate · recover</text>
    <path id="mobile-link0" d="M210 130 V164" stroke="#30363d" stroke-width="2"/><circle r="4" fill="#39d353"><animateMotion dur="1.60s" repeatCount="indefinite"><mpath href="#mobile-link0"/></animateMotion></circle><path id="mobile-link1" d="M210 224 V258" stroke="#30363d" stroke-width="2"/><circle r="4" fill="#39d353"><animateMotion dur="1.80s" repeatCount="indefinite"><mpath href="#mobile-link1"/></animateMotion></circle><path id="mobile-link2" d="M210 318 V352" stroke="#30363d" stroke-width="2"/><circle r="4" fill="#39d353"><animateMotion dur="2.00s" repeatCount="indefinite"><mpath href="#mobile-link2"/></animateMotion></circle><path id="mobile-link3" d="M210 412 V446" stroke="#30363d" stroke-width="2"/><circle r="4" fill="#39d353"><animateMotion dur="2.20s" repeatCount="indefinite"><mpath href="#mobile-link3"/></animateMotion></circle><rect x="90" y="70" width="240" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="210" y="96" text-anchor="middle" fill="#39d353" font-size="14" font-weight="700">USERS</text><text x="210" y="116" text-anchor="middle" fill="#8b949e" font-size="12">requests</text><rect x="90" y="164" width="240" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="210" y="190" text-anchor="middle" fill="#39d353" font-size="14" font-weight="700">EDGE</text><text x="210" y="210" text-anchor="middle" fill="#8b949e" font-size="12">DNS · VPN</text><rect x="90" y="258" width="240" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="210" y="284" text-anchor="middle" fill="#39d353" font-size="14" font-weight="700">NETWORK</text><text x="210" y="304" text-anchor="middle" fill="#8b949e" font-size="12">VLAN · routing</text><rect x="90" y="352" width="240" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="210" y="378" text-anchor="middle" fill="#39d353" font-size="14" font-weight="700">SYSTEMS</text><text x="210" y="398" text-anchor="middle" fill="#8b949e" font-size="12">Linux · Windows</text><rect x="90" y="446" width="2